apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: source-api-alerts
  labels:
    app.kubernetes.io/name: source-api
    release: prometheus
spec:
  groups:
    - name: source-api.availability
      rules:
        - alert: source-apiHighErrorRate
          expr: sum(rate(http_requests_total{service="source-api",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="source-api"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            team: Platform Engineering
          annotations:
            summary: source-api has elevated 5xx responses.
            runbook_url: docs/RUNBOOK.md
        - alert: source-apiUnavailable
          expr: up{job="source-api"} == 0
          for: 5m
          labels:
            severity: critical
            team: Platform Engineering
          annotations:
            summary: source-api is not being scraped or is unavailable.
            runbook_url: docs/RUNBOOK.md
